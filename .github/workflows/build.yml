name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the zip to a release when a v* tag is pushed

env:
  QT_VERSION: '6.8.3'
  FFMPEG_VERSION: '7.1.1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Download FFmpeg (gyan.dev shared build, GPL)
        shell: pwsh
        run: |
          $name = "ffmpeg-$env:FFMPEG_VERSION-full_build-shared"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.7z"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.7z"
          7z x "$env:RUNNER_TEMP\ffmpeg.7z" -o"$env:RUNNER_TEMP" | Out-Null
          "FFMPEG_ROOT=$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="%FFMPEG_ROOT%"
        shell: cmd

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\OneTakeLink"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\OneTakeLink.exe, build\otl-cli.exe $dist
          windeployqt --release --no-translations --no-compiler-runtime "$dist\OneTakeLink.exe"
          Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" $dist
          # MSVC runtime (redistributable) so the app runs without installing it.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $dist
          }
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md $dist
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(OneTakeLink VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $sha = "${{ github.sha }}".Substring(0, 7)
          $zip = "OneTakeLink-$ver-$sha-windows-x64.zip"
          Compress-Archive -Path $dist -DestinationPath "dist\$zip"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OneTakeLink-windows-x64
          path: dist/OneTakeLink
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}

  linux:
    # Compile + unit-test check only; the product targets Windows.
    name: Linux (compile check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
