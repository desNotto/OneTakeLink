name: Build

on:
  push:
    # Pushing the `release` branch (or a vX.Y.Z tag) publishes a GitHub
    # release for the version in CMakeLists.txt.
    branches: [main, release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release for the version in CMakeLists.txt'
        type: boolean
        default: false

permissions:
  contents: write # attach the zip to a release when a v* tag is pushed

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  QT_VERSION: '6.8.3'
  FFMPEG_VERSION: '7.1.1'
  # Must match OTL_SCRCPY_VERSION in CMakeLists.txt (client/server versions must be equal).
  SCRCPY_VERSION: '5.0.1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Download FFmpeg (gyan.dev shared build, GPL)
        shell: pwsh
        run: |
          $name = "ffmpeg-$env:FFMPEG_VERSION-full_build-shared"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.7z"
          # Release downloads occasionally fail transiently: retry.
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.7z"; break }
            catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (5 * $i) }
          }
          7z x "$env:RUNNER_TEMP\ffmpeg.7z" -o"$env:RUNNER_TEMP" | Out-Null
          "FFMPEG_ROOT=$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download scrcpy (adb + scrcpy-server for Android phones)
        shell: pwsh
        run: |
          $name = "scrcpy-win64-v$env:SCRCPY_VERSION"
          $url = "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION/$name.zip"
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\scrcpy.zip"; break }
            catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (5 * $i) }
          }
          Expand-Archive "$env:RUNNER_TEMP\scrcpy.zip" -DestinationPath "$env:RUNNER_TEMP\scrcpy"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\scrcpy" -Recurse -Filter scrcpy-server | Select-Object -First 1).DirectoryName
          foreach ($f in 'adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll','scrcpy-server') {
            if (-not (Test-Path "$dir\$f")) { throw "scrcpy package lacks $f" }
          }
          "SCRCPY_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="%FFMPEG_ROOT%"
        shell: cmd

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\OneTakeLink"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\OneTakeLink.exe, build\otl-cli.exe $dist
          windeployqt --release --translations ru --no-compiler-runtime "$dist\OneTakeLink.exe"
          Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" $dist
          New-Item -ItemType Directory -Force -Path "$dist\android" | Out-Null
          foreach ($f in 'adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll','scrcpy-server') {
            Copy-Item "$env:SCRCPY_DIR\$f" "$dist\android"
          }
          # MSVC runtime (redistributable) so the app runs without installing it.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $dist
          }
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md $dist
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(OneTakeLink VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$ver") {
            throw "Tag ${{ github.ref_name }} does not match version $ver in CMakeLists.txt"
          }
          if ($env:PUBLISH -eq 'true') {
            if (-not (Test-Path "docs/release-notes/v$ver.md")) { throw "docs/release-notes/v$ver.md is missing" }
            $zip = "OneTakeLink-$ver-windows-x64.zip"
          } else {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $zip = "OneTakeLink-$ver-$sha-windows-x64.zip"
          }
          Compress-Archive -Path $dist -DestinationPath "dist\$zip"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\OneTakeLink" "/DOutputDir=$PWD\dist" packaging\windows\onetakelink.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          "SETUP_NAME=OneTakeLink-$env:APP_VERSION-setup-windows-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OneTakeLink-windows-x64
          path: dist/OneTakeLink
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OneTakeLink-setup-windows-x64
          path: dist/${{ env.SETUP_NAME }}
          retention-days: 30

      - name: Publish release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit if it doesn't exist yet.
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: OneTakeLink ${{ env.APP_VERSION }}
          body_path: docs/release-notes/v${{ env.APP_VERSION }}.md
          files: |
            dist/${{ env.SETUP_NAME }}
            dist/${{ env.ZIP_NAME }}

  linux:
    # Compile + unit-test check only; the product targets Windows.
    name: Linux (compile check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libavdevice-dev libswresample-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
